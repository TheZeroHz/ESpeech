# TinyCFG Smart Home — named device support
# Compile: python tools/tinycfg_compiler.py tinycfg/grammars/smarthome.cfg

[meta]
name = smarthome
version = 2

[slots]
location = room, bedroom, kitchen, living, bathroom, garage, office, front, back
device = fan, light, lamp, door, curtain

[terminals]
and :
then :
turn : switch
on : enable
off : disable
light : lamp
fan :
lock :
unlock :
door :
open :
close :
curtain :
bedroom :
living :
kitchen :
room :
bathroom :
garage :
office :
front :
back :
scene :
movie :
night :

[rules]
TASK_LIST -> TASK OP_REST
OP_REST -> and TASK OP_REST
OP_REST ->
TASK -> CMD
CMD -> PAT

[patterns]
turn on {location} light       => LIGHT_ON({location}_light)       @domain smarthome @resource light
turn on {name} {location} light => LIGHT_ON({name}_{location}_light) @domain smarthome @resource light
turn on {name} light           => LIGHT_ON({name}_light)         @domain smarthome @resource light
turn off {location} light      => LIGHT_OFF({location}_light)      @domain smarthome @resource light
turn off {name} {location} light => LIGHT_OFF({name}_{location}_light) @domain smarthome @resource light

turn on {location} fan         => FAN_ON({location}_fan)         @domain smarthome @resource fan
turn on {name} {location} fan  => FAN_ON({name}_{location}_fan)   @domain smarthome @resource fan
turn on {name} fan             => FAN_ON({name}_fan)             @domain smarthome @resource fan
turn off {location} fan        => FAN_OFF({location}_fan)        @domain smarthome @resource fan
turn off {name} {location} fan => FAN_OFF({name}_{location}_fan) @domain smarthome @resource fan

lock {location} door             => LOCK({location}_door)          @domain smarthome @resource lock
lock {name} door               => LOCK({name}_door)              @domain smarthome @resource lock
unlock {location} door         => UNLOCK({location}_door)        @domain smarthome @resource lock
unlock {name} door             => UNLOCK({name}_door)            @domain smarthome @resource lock

open {location} curtain        => CURTAIN_OPEN({location})       @domain smarthome @resource curtain
close {location} curtain       => CURTAIN_CLOSE({location})      @domain smarthome @resource curtain

scene movie => SCENE(movie) @domain smarthome @resource scene
scene night => SCENE(night) @domain smarthome @resource scene
