# TinyCFG Smart-World Composite Grammar v3
# Supports named devices: "rakibs room fan", "kitchen fan", "john bedroom light"
# Slot patterns: {name} = user label, {location} = room/zone, {device} = device type
#
# Compile: python tools/tinycfg_compiler.py tinycfg/grammars/smart_world.cfg

[meta]
name = smart_world
version = 3

[slots]
location = room, bedroom, living, kitchen, bathroom, garage, office, hallway, garden, front, back
device = fan, light, lamp, door, curtain, camera, thermostat

[terminals]
# --- composition operators ---
and     :
or      : alternatively
then    :
after   :
before  :
if      :
until   :
while   :

# --- smarthome ---
turn    : switch, activate, power
on      : enable
off     : disable
light   : lamp, lights
fan     : ceiling
lock    :
unlock  :
door    :
curtain : blinds, shade
open    :
close   : shut
scene   : mode
movie   : cinema, film
night   : sleep, bedtime
party   : disco

# --- locations ---
room        :
bedroom     :
living      : lounge
kitchen     :
bathroom    : washroom
garage      :
office      : study
hallway     : corridor
garden      : yard, backyard
front       :
back        :

# --- robot navigation ---
go      : move, navigate, drive
to      : towards
come    :
here    : me
follow  : track
patrol  : guard, watch
home    : base, dock
dock    : charging
stop    : halt, freeze, cancel
wait    : pause, hold

# --- media ---
play    : start, resume
pause   :
volume  : sound
up      : louder, increase
down    : quieter, decrease, lower
mute    : silence
unmute  :
next    : skip
previous: back, rewind
song    : music, track
radio   : station
playlist:

# --- security ---
arm     : enable
disarm  : disable
alarm   : security
camera  : cameras, cctv
check   : show, view, display
record  : capture

# --- climate ---
thermostat  : temperature, temp, ac, heater
heat        : heating, warm
cool        : cooling, cold
degrees     : degree
set         :
in          :
seventy     : 70

# --- timer ---
timer   : countdown
minute  : minutes, min
minutes :
second  : seconds, sec
seconds :
for     :

# --- numbers (spoken) ---
one     : 1
two     : 2
three   : 3
five    : 5
ten     : 10
fifteen : 15
thirty  : 30

[rules]
TASK_LIST  -> TASK OP_REST
OP_REST    -> OP TASK OP_REST
OP_REST    ->

TASK       -> CMD

OP         -> and   => SEQ_AND
OP         -> then  => SEQ_THEN
OP         -> after => SEQ_AFTER
OP         -> before => SEQ_BEFORE
OP         -> if    => SEQ_IF
OP         -> until => SEQ_UNTIL
OP         -> while => SEQ_WHILE

CMD        -> PAT

[patterns]
# ===== LIGHTS — named & located (slot patterns) =====
turn on {location} light       => LIGHT_ON({location}_light)        @domain smarthome @resource light
turn on {name} {location} light => LIGHT_ON({name}_{location}_light) @domain smarthome @resource light
turn on {name} light           => LIGHT_ON({name}_light)          @domain smarthome @resource light
turn on light                  => LIGHT_ON(default_light)           @domain smarthome @resource light
switch on {location} lamp      => LIGHT_ON({location}_light)      @domain smarthome @resource light

turn off {location} light      => LIGHT_OFF({location}_light)     @domain smarthome @resource light
turn off {name} {location} light => LIGHT_OFF({name}_{location}_light) @domain smarthome @resource light
turn off {name} light          => LIGHT_OFF({name}_light)         @domain smarthome @resource light
turn off light                 => LIGHT_OFF(default_light)          @domain smarthome @resource light

# ===== FANS — room fan, kitchen fan, rakibs room fan =====
turn on {location} fan         => FAN_ON({location}_fan)          @domain smarthome @resource fan
turn on {name} {location} fan  => FAN_ON({name}_{location}_fan)   @domain smarthome @resource fan
turn on {name} fan             => FAN_ON({name}_fan)              @domain smarthome @resource fan
turn on fan                    => FAN_ON(default_fan)             @domain smarthome @resource fan

turn off {location} fan        => FAN_OFF({location}_fan)         @domain smarthome @resource fan
turn off {name} {location} fan => FAN_OFF({name}_{location}_fan)  @domain smarthome @resource fan
turn off {name} fan            => FAN_OFF({name}_fan)             @domain smarthome @resource fan
turn off fan                   => FAN_OFF(default_fan)            @domain smarthome @resource fan

# ===== DOORS & LOCKS — named doors =====
lock {location} door           => LOCK({location}_door)           @domain smarthome @resource lock
lock {name} door               => LOCK({name}_door)               @domain smarthome @resource lock
lock {name} {location} door    => LOCK({name}_{location}_door)    @domain smarthome @resource lock
unlock {location} door         => UNLOCK({location}_door)         @domain smarthome @resource lock
unlock {name} door             => UNLOCK({name}_door)             @domain smarthome @resource lock
unlock {name} {location} door  => UNLOCK({name}_{location}_door)  @domain smarthome @resource lock

# ===== CURTAINS — per room =====
open {location} curtain        => CURTAIN_OPEN({location})        @domain smarthome @resource curtain
open {name} curtain            => CURTAIN_OPEN({name})            @domain smarthome @resource curtain
close {location} curtain       => CURTAIN_CLOSE({location})       @domain smarthome @resource curtain
close {name} curtain           => CURTAIN_CLOSE({name})           @domain smarthome @resource curtain
open curtain                   => CURTAIN_OPEN(living)            @domain smarthome @resource curtain
close curtain                  => CURTAIN_CLOSE(living)           @domain smarthome @resource curtain

# ===== SCENES =====
scene movie                    => SCENE(movie)                    @domain smarthome @resource scene
scene night                    => SCENE(night)                    @domain smarthome @resource scene
scene party                    => SCENE(party)                    @domain smarthome @resource scene
movie mode                     => SCENE(movie)                    @domain smarthome @resource scene
night mode                     => SCENE(night)                    @domain smarthome @resource scene

# ===== ROBOT — named rooms & locations =====
come here                      => COME_HERE()                     @domain robot @resource navigation
go to {location}               => NAV_GO({location})              @domain robot @resource navigation
go to {location} room          => NAV_GO({location})              @domain robot @resource navigation
go to {name} room              => NAV_GO({name}_room)             @domain robot @resource navigation
go to {name} {location}        => NAV_GO({name}_{location})       @domain robot @resource navigation
navigate to {location}         => NAV_GO({location})              @domain robot @resource navigation
follow me                      => FOLLOW_ME()                     @domain robot @resource navigation
patrol {location}              => PATROL({location})              @domain robot @resource navigation
go home                        => NAV_HOME()                      @domain robot @resource navigation
dock                           => NAV_DOCK()                      @domain robot @resource navigation
stop                           => STOP()                          @domain robot @resource navigation
wait                           => WAIT()                          @domain robot @resource navigation

# ===== MEDIA =====
play music                     => MEDIA_PLAY(music)               @domain media @resource player
play radio                     => MEDIA_PLAY(radio)               @domain media @resource player
play {name} playlist           => MEDIA_PLAY({name})              @domain media @resource player
pause music                    => MEDIA_PAUSE()                   @domain media @resource player
pause                          => MEDIA_PAUSE()                   @domain media @resource player
volume up                      => VOLUME_UP()                     @domain media @resource player
volume down                    => VOLUME_DOWN()                   @domain media @resource player
mute                           => MUTE()                          @domain media @resource player
unmute                         => UNMUTE()                        @domain media @resource player
next song                      => NEXT_TRACK()                    @domain media @resource player
previous song                  => PREV_TRACK()                    @domain media @resource player
skip song                      => NEXT_TRACK()                    @domain media @resource player

# ===== SECURITY — named cameras =====
arm alarm                      => ALARM_ARM()                     @domain security @resource alarm
disarm alarm                   => ALARM_DISARM()                  @domain security @resource alarm
check {location} camera        => CAMERA_VIEW({location})         @domain security @resource camera
check {name} camera            => CAMERA_VIEW({name})             @domain security @resource camera
check cameras                  => CAMERA_VIEW(all)                @domain security @resource camera
start recording                => CAMERA_RECORD()                 @domain security @resource camera

# ===== CLIMATE — per zone =====
set {location} thermostat to seventy => TEMP_SET({location}_70)   @domain climate @resource hvac
set thermostat in {location}   => TEMP_ZONE({location})           @domain climate @resource hvac
heat up                        => TEMP_UP()                       @domain climate @resource hvac
cool down                      => TEMP_DOWN()                     @domain climate @resource hvac
turn on heat                   => HEAT_ON()                       @domain climate @resource hvac
turn on cool                   => COOL_ON()                       @domain climate @resource hvac

# ===== TIMER =====
set timer for five minutes     => TIMER_SET(5_min)                @domain timer @resource timer
set timer for ten minutes      => TIMER_SET(10_min)               @domain timer @resource timer
set timer for thirty minutes   => TIMER_SET(30_min)              @domain timer @resource timer
cancel timer                   => TIMER_CANCEL()                  @domain timer @resource timer
